# yatr - https://github.com/cargopete/yatr
#
# Task names match every nuthatch-org nest, so `yatr ci` means the same everywhere.
# The aggregate is `ci`, not `check`: `yatr check` is a builtin and shadows a task of that name.
# This nest is config schema v3: doctor and dev need a nuthatch built with `--features graph`.
# It commits no schema.json / llms.txt, so there is no gen or drift task; folds/ is its derived artifact.

[settings]
cache = true

[tasks.folds]
desc = "Regenerate folds/ from views/26-network-clock.sql and tools/folds/gen-folds.sh"
run = ["bash tools/folds/gen-folds.sh ."]
sources = ["tools/folds/gen-folds.sh", "views/26-network-clock.sql"]
outputs = ["folds/**"]

[tasks.folds-drift]
desc = "Fail if folds/ differs from what tools/folds/gen-folds.sh writes"
run = [
    "bash tools/folds/gen-folds.sh .",
    "git diff --exit-code -- folds",
]
sources = ["tools/folds/gen-folds.sh", "views/26-network-clock.sql", "folds/**"]

[tasks.doctor]
desc = "Probe the configured RPC endpoints for getLogs width and archive depth"
run = ["nuthatch doctor"]
no_cache = true

[tasks.dev]
desc = "Index and serve this nest locally"
run = ["nuthatch dev"]
foreground = true
no_cache = true

[tasks.ci]
desc = "What CI can run without RPC access or indexed data: folds drift only"
depends = ["folds-drift"]
run = []
